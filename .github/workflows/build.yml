name: Build development image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/dev-entrypoint.sh
          bash -n scripts/dev-shell-init.sh
          bash -n scripts/github-app-credential.sh
          bash -n scripts/link-bundles.sh
          bash -n scripts/bundle-deps.sh
          bash -n scripts/sync-app-composer.sh
          bash -n scripts/composer-wrapper.sh
          bash -n scripts/setup.sh
          php -l scripts/generate-dev-composer.php
          php -l scripts/repair-bundle-installers.php
          php -l scripts/verify-dev-composer-lock.php
          php tests/generate-dev-composer-test.php
          php tests/setup-order-test.php

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aggrosoft/pimcore-dev-runtime
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify published development image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker pull ghcr.io/aggrosoft/pimcore-dev-runtime:main
          docker run --rm \
            --entrypoint /bin/bash \
            ghcr.io/aggrosoft/pimcore-dev-runtime:main \
            -lc '
              id developer
              php -v
              composer --version
              composer-real --version
              node --version
              npm --version
              chromium --version
              test -x /opt/aggro/setup.sh
              test -x /usr/local/bin/pimcore-dev-link-bundles
              test -x /usr/local/bin/pimcore-dev-bundle-deps
              test -x /usr/local/bin/pimcore-dev-sync-composer
            '
